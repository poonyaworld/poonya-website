<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact the Poonya app team.">
  <title>Contact | Poonya</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Poonya home">
        <img src="assets/AppLogo.png" alt="Poonya app logo">
        <span>Poonya</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a class="active" href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="section contact-section page-section" aria-labelledby="contact-title">
      <div>
        <p class="eyebrow">Contact us</p>
        <h1 id="contact-title" class="page-title">Have a question about Poonya?</h1>
        <p>
          Send a note about support, privacy, partnerships, or anything else
          related to the app.
        </p>
      </div>

      <iframe
        name="hidden-google-form"
        title="Hidden Google Form response"
        style="display: none;"
      ></iframe>

      <form
        class="contact-form"
        action="https://docs.google.com/forms/d/e/1FAIpQLSeU9A1Gi9pC-ZgVYoummhiKk44hp9prJeG6NsdBwwzhT05UvQ/formResponse"
        method="POST"
        target="hidden-google-form"
        onsubmit="showContactConfirmation(event)"
      >
        <p
          id="contact-confirmation"
          style="display: none;"
          role="status"
          aria-live="polite"
        >
          Message has been successfully delivered. Thank you!
        </p>

        <label for="name">Name</label>
        <input id="name" name="entry.1798958316" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="entry.1572745696" type="email" autocomplete="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="entry.392560332" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/AppLogo.png" alt="" aria-hidden="true">
    <p>Poonya. Small Acts. Big Change. Together.</p>
  </footer>

  <script>
    function showContactConfirmation(event) {
      const form = event.target;
      const confirmation = document.getElementById('contact-confirmation');
      const button = form.querySelector('button[type="submit"]');

      confirmation.style.display = 'block';
      button.disabled = true;
      button.textContent = 'Message Sent';

      setTimeout(() => {
        form.reset();
      }, 500);
    }
  </script>
</body>
</html>
