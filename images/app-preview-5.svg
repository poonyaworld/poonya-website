<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Poonya Daily Compass preview</title>
  <desc id="desc">A vertical app preview screen for the Daily Compass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset=".55" stop-color="#dff5b9"/>
      <stop offset="1" stop-color="#ffdc74"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <rect x="28" y="40" width="132" height="38" rx="19" fill="#ffffff" opacity=".78"/>
  <text x="48" y="65" fill="#134c22" font-family="Arial, sans-serif" font-size="14" font-weight="700">Daily Compass</text>
  <text x="28" y="150" fill="#134c22" font-family="Arial, sans-serif" font-size="38" font-weight="800">Stay</text>
  <text x="28" y="196" fill="#134c22" font-family="Arial, sans-serif" font-size="38" font-weight="800">balanced</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#134c22" text-anchor="middle">
    <circle cx="126" cy="426" r="70" fill="#ffffff" opacity=".7"/>
    <text x="126" y="433">Mind</text>
    <circle cx="264" cy="426" r="70" fill="#ffffff" opacity=".7"/>
    <text x="264" y="433">Kind</text>
    <circle cx="126" cy="572" r="70" fill="#ffffff" opacity=".7"/>
    <text x="126" y="579">Local</text>
    <circle cx="264" cy="572" r="70" fill="#ffffff" opacity=".7"/>
    <text x="264" y="579">Planet</text>
  </g>
  <text x="28" y="744" fill="#47614b" font-family="Arial, sans-serif" font-size="20" font-weight="700">One page for the day.</text>
  <text x="28" y="776" fill="#47614b" font-family="Arial, sans-serif" font-size="20" font-weight="700">Four circles to guide</text>
  <text x="28" y="808" fill="#47614b" font-family="Arial, sans-serif" font-size="20" font-weight="700">your choices.</text>
</svg>
