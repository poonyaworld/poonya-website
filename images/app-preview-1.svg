<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Poonya Daily Spark preview</title>
  <desc id="desc">A vertical app preview screen for the Daily Spark feature.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9d8"/>
      <stop offset="1" stop-color="#e7f6c9"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="312" cy="76" r="82" fill="#f8dd1b" opacity=".34"/>
  <rect x="28" y="40" width="120" height="38" rx="19" fill="#ffffff" opacity=".78"/>
  <text x="48" y="65" fill="#134c22" font-family="Arial, sans-serif" font-size="14" font-weight="700">Daily Spark</text>
  <text x="28" y="150" fill="#134c22" font-family="Arial, sans-serif" font-size="38" font-weight="800">Begin with</text>
  <text x="28" y="196" fill="#134c22" font-family="Arial, sans-serif" font-size="38" font-weight="800">intention</text>
  <text x="28" y="258" fill="#5f6f63" font-family="Arial, sans-serif" font-size="20">Every mindful choice</text>
