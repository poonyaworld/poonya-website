  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#134c22">
    <rect x="28" y="506" width="334" height="62" rx="8" fill="#ffffff" opacity=".75"/>
    <text x="52" y="545">Self</text>
    <rect x="28" y="584" width="334" height="62" rx="8" fill="#ffffff" opacity=".75"/>
    <text x="52" y="623">Others</text>
    <rect x="28" y="662" width="334" height="62" rx="8" fill="#ffffff" opacity=".75"/>
    <text x="52" y="701">Neighborhood</text>
    <rect x="28" y="740" width="334" height="62" rx="8" fill="#ffffff" opacity=".75"/>
    <text x="52" y="779">Earth</text>
  </g>
